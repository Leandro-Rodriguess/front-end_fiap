<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formularios</title>
</head>
<body>

    <h1>Tags estruturais - part 2</h1>

    <hr>

    <h2>criando um formulário</h2>

    <hr>

    <form action="" method="get">

        <fieldset>

            <legend>Forneça seus dados</legend>

            <h3>Dados pessoais: </h3>

            <label for="nome">Nome: </label>
            <input type="text" name="nome" id="nome" required placeholder="nome..."> <br><br>

            <label for="nome">Nome: </label>
            <input type="text" name="sobrenome" id="nome" required placeholder="sobrenome"> <br><br>

            <label for="email">E-mail</label>
            <input type="email" name="email" id="email" placeholder="Digite seu email">

            <h3>Qual o seu genero?</h3>

        <!-- usando radio -->

            <input type="radio" name="genero" value="masculino" id="masculino" required> <!--da opções para o usuario selecionar uma delas -->
            <label for="masculino">masculino</label> <br>

            <input type="radio" name="genero" value="masculino" id="feminino" required> <!--da opções para o usuario selecionar uma delas -->
            <label for="feminino">feminino</label> <br>

            <input type="radio" name="genero" value="masculino" id="outros" required> <!--da opções para o usuario selecionar uma delas -->
            <label for="outros">outros</label> <br>

        </fieldset>



        <h3>Quais meios de transporte usas?</h3>



        <input type="checkbox" name="transportes" id="" value="onibus">
        <label for="onibus">ônibus</label> <br>

        <input type="checkbox" name="transportes" id="" value="metro">
        <label for="onibus">metrô</label> <br>

        <input type="checkbox" name="transportes" id="" value="carro">
        <label for="onibus">carro</label> <br>

        <!-- usando checkbox -->


        <h3>Selecione o seu tamanho de camisa: </h3>

        <select name="tamanho" id="tamanho">
            <option value="pequeno">pequeno</option>

            <option value="medio">medio</option>

            <option value="grande">grande</option>
        </select> 

        <br><br>

        <!-- usando select -->

        <textarea name="opniao" id="opiniao" placeholder="Deixe seu desabafo"></textarea>

        <!-- usando textarea -->

        <br><br>

        <button type="submit">Enviar</button>
        <button type="reset">limpar</button>

        <!-- usando button -->
    </form>


</body>
</html>
